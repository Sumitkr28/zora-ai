// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force EVERY module (app, capacitor-android, and each plugin) onto a
// build-tools version that exists in this machine's SDK.
//
// Capacitor's own modules don't declare buildToolsVersion, so AGP falls back to
// its default (34.0.0) and tries to DOWNLOAD it — which fails behind this
// machine's TLS interception with "PKIX path building failed", surfacing as
// "Failed to find Build Tools revision 34.0.0" on :capacitor-android.
// Setting it on :app alone is not enough; the sub-projects each need it.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                buildToolsVersion rootProject.ext.buildToolsVersion
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
